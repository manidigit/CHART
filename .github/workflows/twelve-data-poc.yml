name: Twelve Data market-data POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-data-smoke-test:
    name: Test XAUUSD and Brent Spot M15 access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Twelve Data API
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/provider_poc/twelve_data_smoke_test.py
