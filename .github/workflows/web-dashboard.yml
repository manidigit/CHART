name: Web dashboard build

on:
  push:
    branches:
      - feature/shared-web-android-dashboard
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-dashboard.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
