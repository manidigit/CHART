name: Build Android APK and Package Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Materialize canonical debug keystore (Yadin Pattern)
        run: |
          CANONICAL_B64=""
          if [ ! -s debug.keystore ] || [ $(wc -c < debug.keystore) -lt 1000 ]; then
            if [ -s debug.keystore.base64 ] && [ $(wc -c < debug.keystore.base64) -gt 1000 ]; then
              echo "Decoding debug keystore from file debug.keystore.base64..."
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "Decoding canonical debug keystore from embedded base64 payload..."
              echo "$CANONICAL_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            fi
          fi
          mkdir -p ~/.android app
          cp -f debug.keystore app/debug.keystore
          cp -f debug.keystore ~/.android/debug.keystore
          echo "Verifying keystore fingerprint..."
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"
          ls -la debug.keystore

      - name: Ensure Clean Binary Fonts and Mipmap Resources
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL "https://fonts.gstatic.com/s/vazirmatn/v16/Dxx78j6PP2D_kU2muijPEe1n2vVbfJRklWgzCRCT6w.ttf" -o app/src/main/res/font/vazirmatn.ttf
          curl -fsSL "https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxTOlOQ.ttf" -o app/src/main/res/font/jetbrains_mono.ttf
          # Keep the checked-in launcher icon PNGs intact. Do not regenerate or overwrite mipmap resources during CI.


      - name: Prepare .env for Secrets Gradle Plugin
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -n "$TWELVE_KEY" ]; then
            echo "TWELVE_DATA_API_KEY=$TWELVE_KEY" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chart-intelligence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package-web-subdomain:
    name: Package and Deploy Subdomain Web Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PEPPERSTONE:SPOTBRENT and OANDA:XAUUSD Candles via tvdatafeed (5,000 Bars)
        run: |
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git pandas || true
          python3 host_subdomain/scripts/sync_tvdatafeed.py \
            --symbol SPOTBRENT \
            --exchange PEPPERSTONE \
            --bars 5000 \
            --output-dir host_subdomain/data/tvdatafeed || true
          python3 host_subdomain/scripts/sync_tvdatafeed.py \
            --symbol XAUUSD \
            --exchange OANDA \
            --bars 5000 \
            --output-dir host_subdomain/data/tvdatafeed || true

      - name: Upload Subdomain Web Package Artifact (Public-Safe)
        uses: actions/upload-artifact@v4
        with:
          name: host-subdomain-web-package
          path: host_subdomain/
          if-no-files-found: error

      - name: Deploy Web Package to cPanel (chart.manico.es)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DOCROOT: ${{ secrets.CPANEL_DOCROOT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USERNAME" ] || [ -z "$CPANEL_API_TOKEN" ] || [ -z "$CPANEL_DOCROOT" ]; then
            echo "cPanel deployment secrets not available in this context; skipping remote upload."
            exit 0
          fi
          mkdir -p host_subdomain/config
          python3 - << 'EOF'
          import os, json, base64, subprocess

          cfg = f"""<?php
          return [
              'DB_HOST' => 'localhost',
              'DB_NAME' => {repr(os.environ.get('DB_NAME', ''))},
              'DB_USER' => {repr(os.environ.get('DB_USER', ''))},
              'DB_PASSWORD' => {repr(os.environ.get('DB_PASSWORD', ''))},
              'TWELVE_DATA_API_KEY' => {repr(os.environ.get('TWELVE_DATA_API_KEY', ''))},
          ];
          """
          with open("host_subdomain/config/env.local.php", "w", encoding="utf-8") as f:
              f.write(cfg)

          bundle = {}
          for root, _, files in os.walk("host_subdomain"):
              for fname in files:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, "host_subdomain").replace("\\", "/")
                  with open(full_path, "rb") as bf:
                      bundle[rel_path] = base64.b64encode(bf.read()).decode("ascii")

          bundle_json = json.dumps(bundle)
          deployer_php = f"""<?php
          $files = json_decode({repr(bundle_json)}, true);
          $snapshotName = 'snapshot_' . gmdate('Ymd_His');
          $backupRoot = dirname(__DIR__) . '/_ci_backups';
          try {{
              if (!is_dir($backupRoot)) {{
                  @mkdir($backupRoot, 0755, true);
              }}
              $snapDir = $backupRoot . '/' . $snapshotName;
              @mkdir($snapDir, 0755, true);
              $copyRec = function (string $src, string $dst) use (&$copyRec): void {{
                  if (!is_dir($src)) return;
                  if (!is_dir($dst)) @mkdir($dst, 0755, true);
                  foreach (scandir($src) ?: [] as $entry) {{
                      if ($entry === '.' || $entry === '..') continue;
                      $s = $src . '/' . $entry;
                      $d = $dst . '/' . $entry;
                      if (is_dir($s)) $copyRec($s, $d);
                      else @copy($s, $d);
                  }}
              }};
              foreach (['api', 'assets', 'i18n', 'migrations'] as $dirName) {{
                  $copyRec(__DIR__ . '/' . $dirName, $snapDir . '/' . $dirName);
              }}
              if (is_file(__DIR__ . '/index.html')) {{
                  @copy(__DIR__ . '/index.html', $snapDir . '/index.html');
              }}
              // Keep only last 3 deployment snapshots
              $allSnaps = glob($backupRoot . '/snapshot_*', GLOB_ONLYDIR) ?: [];
              rsort($allSnaps, SORT_STRING);
              foreach (array_slice($allSnaps, 3) as $staleSnap) {{
                  $rmRec = function (string $p) use (&$rmRec): void {{
                      if (!is_dir($p)) return;
                      foreach (scandir($p) ?: [] as $e) {{
                          if ($e === '.' || $e === '..') continue;
                          $child = $p . '/' . $e;
                          if (is_dir($child)) $rmRec($child);
                          else @unlink($child);
                      }}
                      @rmdir($p);
                  }};
                  $rmRec($staleSnap);
              }}

              foreach ($files as $rel => $b64) {{
                  $target = __DIR__ . '/' . $rel;
                  $dir = dirname($target);
                  if (!is_dir($dir)) {{
                      @mkdir($dir, 0755, true);
                  }}
                  $tmpTarget = $target . '.tmp_' . getmypid();
                  if (file_put_contents($tmpTarget, base64_decode($b64)) !== false) {{
                      @rename($tmpTarget, $target);
                  }} else {{
                      file_put_contents($target, base64_decode($b64));
                  }}
              }}

              $seededCandles = 0;
              try {{
                  require_once __DIR__ . '/api/v1/core/Database.php';
                  $pdo = \\ChartIntelligence\\Core\\Database::getPdo();
                  if ($pdo !== null) {{
                      foreach (['001_phase1_init.sql', '002_phase2_3_tables.sql'] as $migFileName) {{
                          $migrationFile = __DIR__ . '/migrations/' . $migFileName;
                          if (is_file($migrationFile)) {{
                              $migSql = (string) file_get_contents($migrationFile);
                              $queries = array_filter(array_map('trim', explode(';', $migSql)));
                              foreach ($queries as $q) {{
                                  if ($q !== '' && !str_starts_with($q, '--')) {{
                                      try {{ $pdo->exec($q); }} catch (\\Throwable) {{}}
                                  }}
                              }}
                          }}
                      }}
                      @$pdo->exec("DELETE FROM candles WHERE timeframe NOT IN ('D1', 'W1') AND chart_id NOT IN ('chart_btcusd_spot', 'chart_ethusd_spot') AND volume = 0 AND (high_price - low_price) < (open_price * 0.00018) AND (FLOOR(open_time_utc / 1000) MOD 604800) BETWEEN 165600 AND 338399");
                      $sql = "INSERT INTO candles
                          (chart_id, provider_id, timeframe, open_time_utc,
                           open_price, high_price, low_price, close_price, volume, is_closed)
                          VALUES (:cid, 'tvdatafeed', :tf, :open_ms, :o, :h, :l, :c, :v, 1)
                          ON DUPLICATE KEY UPDATE
                          open_price = VALUES(open_price),
                          high_price = VALUES(high_price),
                          low_price  = VALUES(low_price),
                          close_price = VALUES(close_price),
                          volume     = VALUES(volume)";
                      $stmt = $pdo->prepare($sql);
                      $symbolMap = [
                          'SPOTBRENT' => 'chart_spotbrent_main',
                          'XAUUSD'    => 'chart_xauusd_main',
                      ];
                      foreach ($symbolMap as $sym => $cid) {{
                          foreach (['M15', 'H1', 'H4', 'D1', 'W1'] as $tf) {{
                              $jsonPath = __DIR__ . '/data/tvdatafeed/' . $sym . '_' . $tf . '.json';
                              if (is_file($jsonPath)) {{
                                  $decoded = json_decode((string) file_get_contents($jsonPath), true);
                                  $rows = $decoded['candles'] ?? [];
                                  if (is_array($rows) && count($rows) > 0) {{
                                      $pdo->beginTransaction();
                                      foreach ($rows as $bar) {{
                                          $stmt->execute([
                                              ':cid'     => $cid,
                                              ':tf'      => $tf,
                                              ':open_ms' => (int) ($bar['open_time_utc_ms'] ?? 0),
                                              ':o'       => (string) ($bar['open'] ?? '0'),
                                              ':h'       => (string) ($bar['high'] ?? '0'),
                                              ':l'       => (string) ($bar['low'] ?? '0'),
                                              ':c'       => (string) ($bar['close'] ?? '0'),
                                              ':v'       => (string) ($bar['volume'] ?? '0'),
                                          ]);
                                          $seededCandles++;
                                      }}
                                      $pdo->commit();
                                  }}
                              }}
                          }}
                      }}
                  }}
              }} catch (\\Throwable $e) {{
                  // Database seeding error caught, web deployment stays intact
              }}
              header('Content-Type: application/json');
              echo json_encode(['ok' => true, 'snapshot' => $snapshotName, 'deployed_files' => count($files), 'seeded_tvdatafeed_candles' => $seededCandles]);
          }} catch (\\Throwable $fatal) {{
              http_response_code(500);
              header('Content-Type: application/json');
              echo json_encode(['ok' => false, 'error' => $fatal->getMessage()]);
          }} finally {{
              @unlink(__FILE__);
          }}
          """
          with open("/tmp/_deploy_phase1.php", "w", encoding="utf-8") as df:
              df.write(deployer_php)

          host = os.environ["CPANEL_HOST"].strip().rstrip("/")
          if not host.startswith("http"):
              host = f"https://{host}:2083"
          elif ":2083" not in host and ":2082" not in host:
              host = f"{host}:2083"
          user = os.environ["CPANEL_USERNAME"].strip()
          token = os.environ["CPANEL_API_TOKEN"].strip()
          docroot = os.environ["CPANEL_DOCROOT"].strip().rstrip("/")
          auth_header = f"Authorization: cpanel {user}:{token}"

          def run_curl_checked(cmd, label):
              proc = subprocess.run(cmd, capture_output=True, text=True)
              if proc.returncode != 0:
                  raise RuntimeError(f"{{label}} curl failed ({{proc.returncode}}): {{proc.stderr}}")
              lines = proc.stdout.strip().splitlines()
              code = int(lines[-1]) if lines and lines[-1].isdigit() else 0
              body = "\n".join(lines[:-1]) if lines and lines[-1].isdigit() else proc.stdout
              if code >= 400:
                  raise RuntimeError(f"{{label}} HTTP {{code}}: {{body}}")
              return body

          for target_file, local_file in [("_deploy_phase1.php", "/tmp/_deploy_phase1.php"), ("index.html", "host_subdomain/index.html")]:
              run_curl_checked([
                  "curl", "-ksS", "-w", "\\n%{{http_code}}", "-H", auth_header,
                  "-F", f"dir={docroot}",
                  "-F", "overwrite=1",
                  "-F", f"file-1=@{local_file};filename={target_file}",
                  f"{host}/execute/Fileman/upload_files"
              ], f"upload {{target_file}}")
              run_curl_checked([
                  "curl", "-ksS", "-w", "\\n%{{http_code}}", "-H", auth_header,
                  "--data-urlencode", f"dir={docroot}",
                  "--data-urlencode", f"file={target_file}",
                  "--data-urlencode", f"content@{local_file}",
                  f"{host}/execute/Fileman/save_file_content"
              ], f"save {{target_file}}")

          deploy_out = run_curl_checked([
              "curl", "-ksSL", "-w", "\\n%{{http_code}}", "https://chart.manico.es/_deploy_phase1.php"
          ], "execute _deploy_phase1.php")
          print("Deploy response:", deploy_out)
          if '"ok":true' not in deploy_out.replace(" ", ""):
              raise RuntimeError(f"Deploy script did not return ok=true: {{deploy_out}}")
          EOF
