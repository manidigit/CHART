name: Build Android APK and Package Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Materialize canonical debug keystore (Yadin Pattern)
        run: |
          CANONICAL_B64=""
          if [ ! -s debug.keystore ] || [ $(wc -c < debug.keystore) -lt 1000 ]; then
            if [ -s debug.keystore.base64 ] && [ $(wc -c < debug.keystore.base64) -gt 1000 ]; then
              echo "Decoding debug keystore from file debug.keystore.base64..."
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              echo "Decoding canonical debug keystore from embedded base64 payload..."
              echo "$CANONICAL_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            fi
          fi
          mkdir -p ~/.android app
          cp -f debug.keystore app/debug.keystore
          cp -f debug.keystore ~/.android/debug.keystore
          echo "Verifying keystore fingerprint..."
          keytool -list -v -keystore debug.keystore -storepass android | grep -E "SHA1|SHA256"
          ls -la debug.keystore

      - name: Ensure Fonts and Mipmap Resources Exist
        run: |
          mkdir -p app/src/main/res/font
          if [ ! -f app/src/main/res/font/vazirmatn.ttf ]; then
            curl -fsSL "https://fonts.gstatic.com/s/vazirmatn/v16/Dxx78j6PP2D_kU2muijPEe1n2vVbfJRklWgzCRCT6w.ttf" -o app/src/main/res/font/vazirmatn.ttf
          fi
          if [ ! -f app/src/main/res/font/jetbrains_mono.ttf ]; then
            curl -fsSL "https://fonts.gstatic.com/s/jetbrainsmono/v24/tDbY2o-flEEny0FZhsfKu5WU4zr3E_BX0PnT8RD8yKxTOlOQ.ttf" -o app/src/main/res/font/jetbrains_mono.ttf
          fi
          if [ ! -f app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
            python3 - << 'EOF'
          import os, struct, zlib
          def make_png(path, width, height):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              raw = b"".join(b"\x00" + b"\x0b\x0f\x17\xff" * width for _ in range(height))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", width, height, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)
          for folder, sz in [("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)]:
              make_png(f"app/src/main/res/mipmap-{folder}/ic_launcher.png", sz, sz)
              make_png(f"app/src/main/res/mipmap-{folder}/ic_launcher_round.png", sz, sz)
          EOF
          fi

      - name: Prepare .env for Secrets Gradle Plugin
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -n "$TWELVE_KEY" ]; then
            echo "TWELVE_DATA_API_KEY=$TWELVE_KEY" > .env
          elif [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare google-services.json for CI Build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        run: |
          if [ ! -f app/google-services.json ]; then
            API_KEY="${FIREBASE_API_KEY:-AIzaSyCIPlaceholderKeyForDebugBuild00000}"
            cat <<EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "643150512949",
              "project_id": "my-project-1485866417177",
              "storage_bucket": "my-project-1485866417177.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:643150512949:android:6e93b975c8b83579bd427c",
                  "android_client_info": {
                    "package_name": "es.manico.chartintelligence"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "643150512949-1108tnjaq0ralt7rfl3mrl3k5rm789be.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "$API_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "643150512949-1108tnjaq0ralt7rfl3k5rm789be.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chart-intelligence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package-web-subdomain:
    name: Package and Deploy Subdomain Web Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract PEPPERSTONE:SPOTBRENT Candles via tvdatafeed (5,000 Bars)
        run: |
          pip install --upgrade --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git pandas || true
          python3 host_subdomain/scripts/sync_tvdatafeed.py \
            --symbol SPOTBRENT \
            --exchange PEPPERSTONE \
            --bars 5000 \
            --output-dir host_subdomain/data/tvdatafeed || true

      - name: Upload Subdomain Web Package Artifact (Public-Safe)
        uses: actions/upload-artifact@v4
        with:
          name: host-subdomain-web-package
          path: host_subdomain/
          if-no-files-found: error

      - name: Deploy Web Package to cPanel (chart.manico.es)
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CPANEL_DOCROOT: ${{ secrets.CPANEL_DOCROOT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          if [ -z "$CPANEL_HOST" ] || [ -z "$CPANEL_USERNAME" ] || [ -z "$CPANEL_API_TOKEN" ] || [ -z "$CPANEL_DOCROOT" ]; then
            echo "cPanel deployment secrets not available in this context; skipping remote upload."
            exit 0
          fi
          mkdir -p host_subdomain/config
          python3 - << 'EOF'
          import os, json, base64, subprocess

          cfg = f"""<?php
          return [
              'DB_HOST' => 'localhost',
              'DB_NAME' => {repr(os.environ.get('DB_NAME', ''))},
              'DB_USER' => {repr(os.environ.get('DB_USER', ''))},
              'DB_PASSWORD' => {repr(os.environ.get('DB_PASSWORD', ''))},
              'TWELVE_DATA_API_KEY' => {repr(os.environ.get('TWELVE_DATA_API_KEY', ''))},
          ];
          """
          with open("host_subdomain/config/env.local.php", "w", encoding="utf-8") as f:
              f.write(cfg)

          bundle = {}
          for root, _, files in os.walk("host_subdomain"):
              for fname in files:
                  full_path = os.path.join(root, fname)
                  rel_path = os.path.relpath(full_path, "host_subdomain").replace("\\", "/")
                  with open(full_path, "rb") as bf:
                      bundle[rel_path] = base64.b64encode(bf.read()).decode("ascii")

          bundle_json = json.dumps(bundle)
          deployer_php = f"""<?php
          $files = json_decode({repr(bundle_json)}, true);
          foreach ($files as $rel => $b64) {{
              $target = __DIR__ . '/' . $rel;
              $dir = dirname($target);
              if (!is_dir($dir)) {{
                  @mkdir($dir, 0755, true);
              }}
              file_put_contents($target, base64_decode($b64));
          }}
          require_once __DIR__ . '/api/v1/core/Database.php';
          $pdo = \\ChartIntelligence\\Core\\Database::getPdo();
          $seededCandles = 0;
          if ($pdo !== null) {{
              $sql = "INSERT INTO candles
                  (chart_id, provider_id, timeframe, open_time_utc_ms, open_time_utc_iso,
                   open_price, high_price, low_price, close_price, volume)
                  VALUES (:cid, 'tvdatafeed', :tf, :ms, :iso, :o, :h, :l, :c, :v)
                  ON DUPLICATE KEY UPDATE
                  open_price = VALUES(open_price),
                  high_price = VALUES(high_price),
                  low_price  = VALUES(low_price),
                  close_price = VALUES(close_price),
                  volume     = VALUES(volume)";
              $stmt = $pdo->prepare($sql);
              foreach (['M15', 'H1', 'H4', 'D1'] as $tf) {{
                  $jsonPath = __DIR__ . '/data/tvdatafeed/SPOTBRENT_' . $tf . '.json';
                  if (is_file($jsonPath)) {{
                      $decoded = json_decode((string) file_get_contents($jsonPath), true);
                      $rows = $decoded['candles'] ?? [];
                      if (is_array($rows) && count($rows) > 0) {{
                          $pdo->beginTransaction();
                          foreach ($rows as $bar) {{
                              $stmt->execute([
                                  ':cid' => 'chart_spotbrent_main',
                                  ':tf'  => $tf,
                                  ':ms'  => (int) ($bar['open_time_utc_ms'] ?? 0),
                                  ':iso' => (string) ($bar['open_time_utc_iso'] ?? ''),
                                  ':o'   => (string) ($bar['open'] ?? '0'),
                                  ':h'   => (string) ($bar['high'] ?? '0'),
                                  ':l'   => (string) ($bar['low'] ?? '0'),
                                  ':c'   => (string) ($bar['close'] ?? '0'),
                                  ':v'   => (string) ($bar['volume'] ?? '0'),
                              ]);
                              $seededCandles++;
                          }}
                          $pdo->commit();
                      }}
                  }}
              }}
          }}
          @unlink(__FILE__);
          header('Content-Type: application/json');
          echo json_encode(['ok' => true, 'deployed_files' => count($files), 'seeded_tvdatafeed_candles' => $seededCandles]);
          """
          with open("/tmp/_deploy_phase1.php", "w", encoding="utf-8") as df:
              df.write(deployer_php)

          host = os.environ["CPANEL_HOST"].strip().rstrip("/")
          if not host.startswith("http"):
              host = f"https://{host}:2083"
          elif ":2083" not in host and ":2082" not in host:
              host = f"{host}:2083"
          user = os.environ["CPANEL_USERNAME"].strip()
          token = os.environ["CPANEL_API_TOKEN"].strip()
          docroot = os.environ["CPANEL_DOCROOT"].strip().rstrip("/")
          auth_header = f"Authorization: cpanel {user}:{token}"

          # Upload self-extracting deployer and index.html to docroot via Fileman/upload_files and Fileman/save_file_content
          # Use content@{local_file} so curl reads large payloads (>128KB) from disk instead of hitting Linux MAX_ARG_STRLEN in execve
          for target_file, local_file in [("_deploy_phase1.php", "/tmp/_deploy_phase1.php"), ("index.html", "host_subdomain/index.html")]:
              subprocess.run([
                  "curl", "-ksS", "-H", auth_header,
                  "-F", f"dir={docroot}",
                  "-F", "overwrite=1",
                  "-F", f"file-1=@{local_file};filename={target_file}",
                  f"{host}/execute/Fileman/upload_files"
              ], check=False, stdout=subprocess.DEVNULL)
              subprocess.run([
                  "curl", "-ksS", "-H", auth_header,
                  "--data-urlencode", f"dir={docroot}",
                  "--data-urlencode", f"file={target_file}",
                  "--data-urlencode", f"content@{local_file}",
                  f"{host}/execute/Fileman/save_file_content"
              ], check=False, stdout=subprocess.DEVNULL)

          # Trigger extraction and MariaDB schema initialization
          subprocess.run(["curl", "-ksSL", "https://chart.manico.es/_deploy_phase1.php"], check=False)
          EOF
