<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Chart Intelligence · TradingView Pro Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/theme.css?v=1.39.0" />
    <style>
      /* Fallback error banner styling if scripts fail or encounter delays */
      #ci-fallback-banner {
        display: none;
        position: fixed;
        bottom: 24px;
        inset-inline: 24px;
        max-width: 580px;
        margin: 0 auto;
        background: #181c27;
        border: 1px solid #2962ff;
        border-radius: 12px;
        padding: 16px 20px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        color: #d1d4dc;
        font-family: 'Vazirmatn', system-ui, sans-serif;
        z-index: 99999;
        direction: rtl;
      }
      #ci-fallback-banner.is-active {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .ci-fb-btn {
        background: #2962ff;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-weight: 700;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .ci-fb-btn:hover {
        background: #1e53e5;
      }
    </style>
  </head>
  <body class="theme-dark">
    <!-- Neutral Workspace Loading Skeleton (no fake prices, usernames, or fabricated candles) -->
    <div id="app">
      <div
        id="app-root"
        class="tv-app-shell"
        dir="ltr"
        style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-deep, #131722); color: var(--text, #d1d4dc);"
      >
        <header class="tv-topbar" style="justify-content: space-between; padding: 0 14px;">
          <div class="tv-brand" style="display: flex; align-items: center; gap: 8px;">
            <div class="tv-logo">CI</div>
            <span class="ltr-num" style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: var(--text-strong);">CHART INTELLIGENCE</span>
          </div>
          <span class="ltr-num" style="font-size: 11px; color: var(--text-muted); font-weight: 600;">Initializing workspace…</span>
        </header>
        <div
          style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 14px;"
        >
          <div
            style="width: min(440px, 100%); background: var(--surface, #1e222d); border: 1px solid var(--border, #2a2e39); border-radius: 10px; padding: 22px; display: flex; flex-direction: column; gap: 12px;"
          >
            <div style="display: flex; align-items: center; justify-content: space-between;">
              <div style="height: 14px; width: 42%; border-radius: 4px; background: rgba(148, 163, 184, 0.16);"></div>
              <div style="height: 14px; width: 22%; border-radius: 4px; background: rgba(41, 98, 255, 0.22);"></div>
            </div>
            <div style="height: 120px; width: 100%; border-radius: 8px; background: rgba(19, 23, 34, 0.65); border: 1px dashed rgba(148, 163, 184, 0.18); display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: var(--text-muted);">
              Loading Chart Intelligence workspace…
            </div>
            <div style="display: flex; gap: 8px;">
              <div style="height: 10px; flex: 1; border-radius: 4px; background: rgba(148, 163, 184, 0.12);"></div>
              <div style="height: 10px; flex: 1; border-radius: 4px; background: rgba(148, 163, 184, 0.12);"></div>
              <div style="height: 10px; flex: 1; border-radius: 4px; background: rgba(148, 163, 184, 0.12);"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Fallback Error Boundary & Graceful Diagnostics Banner -->
    <div id="ci-fallback-banner">
      <div>
        <div style="font-weight: 800; font-size: 14px; color: #ffb74d;">محیط کاری در حال همگام‌سازی است</div>
        <div style="font-size: 12px; color: #9aa0a6; margin-top: 3px;" id="ci-fallback-msg">در صورت تأخیر اسکریپت‌ها، کلیک کنید تا کش مرورگر تازه‌سازی شود.</div>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="ci-fb-btn" onclick="location.reload(true);">تازه‌سازی محیط کاری</button>
      </div>
    </div>

    <!-- Inline Startup Watchdog & Error Boundary -->
    <script>
      (function() {
        var mounted = false;
        window.__CI_APP_MOUNTED__ = false;

        function showFallbackBanner(msg) {
          var el = document.getElementById('ci-fallback-banner');
          var textEl = document.getElementById('ci-fallback-msg');
          if (el) {
            el.classList.add('is-active');
            if (textEl && msg) textEl.textContent = msg;
          }
        }

        window.addEventListener('error', function(e) {
          console.warn('[CI Watchdog] Unhandled script error:', e.message);
          if (!window.__CI_APP_MOUNTED__) {
            showFallbackBanner('خطایی در بارگذاری ماژول‌ها رخ داد: ' + (e.message || 'خطای شبکه'));
          }
        });

        window.addEventListener('unhandledrejection', function(e) {
          console.warn('[CI Watchdog] Unhandled promise rejection:', e.reason);
        });

        // 4.5 second watchdog
        setTimeout(function() {
          if (!window.__CI_APP_MOUNTED__) {
            var banner = document.getElementById('ci-fallback-banner');
            if (banner && !banner.classList.contains('is-active')) {
              showFallbackBanner('بارگذاری اسکریپت‌ها بیش از حد معمول طول کشید.');
            }
          }
        }, 4500);
      })();
    </script>

    <script type="module" src="./assets/js/app.js?v=1.39.0"></script>
  </body>
</html>
